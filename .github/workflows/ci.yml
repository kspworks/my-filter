name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A weekly run against a fresh install is what turns this suite into an
  # early warning about upstream changes, rather than something that only
  # speaks up once someone has already started an upgrade.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository, and on a public repo a fork's pull
# request should not get a token that could.
permissions:
  contents: read

env:
  # The app validates its environment at import time, so even `next build`
  # needs these. They point at throwaway local state.
  DATABASE_URL: "file:./.e2e/e2e.db"
  BETTER_AUTH_SECRET: "ci-secret-ci-secret-ci-secret-ci-secret"
  BETTER_AUTH_URL: "http://127.0.0.1:3100"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test:coverage

      # Not just a smoke check: this is the only place the React Compiler runs,
      # so a component that breaks the Rules of React fails here and nowhere else.
      # `next build` opens the database while collecting page data, so it has to
      # exist first.
      - name: Prepare the throwaway database
        run: pnpm test:e2e:db

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Vercel's own Git deploys are switched off (`vercel.json`), so this job is the
  # only way anything reaches production, and only after `verify` has passed.
  # Promotion-time gating would not be enough: `vercel-build` runs `db:migrate`,
  # so by the time a deployment waits to be promoted the production database has
  # already moved. The build still happens on Vercel, with the production
  # environment it already holds; GitHub needs nothing but a token.
  #
  # The previous deployment keeps serving for a moment against the migrated
  # schema, so migrations have to stay additive: expand, deploy, then contract.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # The workflow-level group cancels a superseded run, which is right for
    # `verify` but not for a deploy that is already uploading.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy to Vercel production
        run: npx --yes vercel@59 deploy --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
